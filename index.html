<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La casa di Lory — Portoscuso</title>
<meta name="theme-color" content="#0B3D4E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --abisso:#0B3D4E;
  --mare:#14697F;
  --acqua:#3FA9B4;
  --schiuma:#9FD8D5;
  --sabbia:#F2EBDD;
  --sabbia-scura:#E4D9C4;
  --carta:#FBF7EF;
  --sole:#E9A32C;
  --testo:#0B3D4E;
  --testo-soft:#4A6E77;
  --sp:clamp(20px,4vw,56px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--sabbia);color:var(--testo);
  font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:1000px;margin:0 auto;padding:0 var(--sp)}
h1,h2,h3{margin:0;font-family:"Darker Grotesque",system-ui,sans-serif;line-height:.94;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--acqua);margin:0 0 12px}

/* ================= MARE ================= */
.sea{position:relative;background:linear-gradient(178deg,#082E3C 0%,var(--abisso) 22%,var(--mare) 62%,#1E8496 100%);
  color:var(--carta);padding-bottom:clamp(90px,14vw,190px);overflow:hidden}
.sea::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 72% 8%,rgba(233,163,44,.22),transparent 60%)}
.sea>*{position:relative;z-index:2}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:22px 0 0}
.brand{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.16em;
  color:var(--schiuma)}
#lang{display:flex;gap:2px}
#lang button{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;
  background:none;border:1px solid transparent;padding:5px 8px;border-radius:2px;
  color:rgba(251,247,239,.6);cursor:pointer;text-transform:uppercase;transition:.25s}
#lang button:hover{color:var(--carta);border-color:rgba(159,216,213,.4)}
#lang button[aria-current="true"]{background:var(--schiuma);color:var(--abisso);border-color:var(--schiuma)}

.hero{padding:clamp(52px,9vw,110px) 0 0}
.hero h1{font-size:clamp(56px,12.5vw,140px);font-weight:900;letter-spacing:-.025em}
.hero h1 span{display:block;opacity:0;transform:translateY(30px);
  animation:sale .95s cubic-bezier(.16,.8,.3,1) forwards}
.hero h1 span:nth-child(1){animation-delay:.10s}
.hero h1 span:nth-child(2){animation-delay:.22s;color:var(--schiuma)}
.hero h1 span:nth-child(3){animation-delay:.34s}
.hero .lede{max-width:52ch;font-size:clamp(17px,2.1vw,20px);color:rgba(251,247,239,.82);
  margin:26px 0 0;opacity:0;animation:sale .95s cubic-bezier(.16,.8,.3,1) .48s forwards}
@keyframes sale{to{opacity:1;transform:none}}

/* onde */
.waves{position:absolute;left:0;right:0;bottom:-1px;z-index:1;line-height:0}
.waves svg{display:block;width:200%;height:clamp(70px,11vw,150px)}
.waves svg:nth-child(1){animation:scorri 21s linear infinite;opacity:.28}
.waves svg:nth-child(2){animation:scorri 14s linear infinite reverse;opacity:.45;
  margin-top:clamp(-58px,-8.4vw,-116px)}
.waves svg:nth-child(3){animation:scorri 27s linear infinite;
  margin-top:clamp(-40px,-6vw,-84px)}
@keyframes scorri{to{transform:translateX(-50%)}}

/* fatti — poggiano sulla sabbia, risalendo sull'onda */
.facts{position:relative;z-index:3;margin-top:clamp(-56px,-7vw,-84px);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  background:var(--sabbia-scura);border:1px solid var(--sabbia-scura);
  box-shadow:0 22px 50px -28px rgba(11,61,78,.55)}
.fact{background:var(--carta);padding:20px 22px}
.fact dt{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--testo-soft)}
.fact dd{margin:4px 0 0;font-family:"Darker Grotesque",sans-serif;font-size:42px;font-weight:900;line-height:1}
.fact dd small{font-family:"Instrument Sans",sans-serif;font-size:13px;font-weight:400;
  color:var(--testo-soft);display:block;line-height:1.35;margin-top:5px}

/* ================= SEZIONI ================= */
section{padding:clamp(56px,8vw,100px) 0}
section+section{border-top:1px solid var(--sabbia-scura)}
section h2{font-size:clamp(40px,6.6vw,72px);font-weight:900;letter-spacing:-.02em}
.sub{color:var(--testo-soft);max-width:58ch;margin:16px 0 0}

.reveal{opacity:0;transform:translateY(26px);
  transition:opacity .8s ease,transform .8s cubic-bezier(.16,.8,.3,1)}
.reveal.in{opacity:1;transform:none}

/* giornata */
.day{margin-top:clamp(30px,4vw,44px)}
.lane{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center;margin-bottom:10px}
.lane-name{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--testo-soft);text-align:right}
.track{position:relative;height:50px;background:var(--carta);
  border:1px solid var(--sabbia-scura);overflow:hidden;
  background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(100%/24 - 1px),var(--sabbia-scura) calc(100%/24 - 1px),var(--sabbia-scura) calc(100%/24))}
.seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 12px;
  font-family:"JetBrains Mono",monospace;font-size:11.5px;white-space:nowrap;overflow:hidden;
  transform:scaleX(0);transform-origin:left;animation:apri .85s cubic-bezier(.16,.8,.3,1) forwards}
.seg>span{opacity:0;animation:sfuma .5s ease .45s forwards}
@keyframes apri{to{transform:none}}
@keyframes sfuma{to{opacity:1}}
.in .seg{animation-play-state:running}
.seg-quiet{background:var(--abisso);color:var(--schiuma)}
.seg-in{background:var(--sole);color:#3B2600}
.seg-out{background:var(--acqua);color:#04333A}
.hours{display:grid;grid-template-columns:118px 1fr;gap:14px;margin-top:6px}
.hours div:last-child{display:flex;justify-content:space-between;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--testo-soft)}

/* regole */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));
  gap:clamp(14px,1.8vw,20px);margin-top:clamp(30px,4vw,44px)}
.rule{background:var(--carta);padding:26px 24px;border:1px solid var(--sabbia-scura);
  border-top:3px solid var(--acqua);transition:transform .35s cubic-bezier(.16,.8,.3,1),box-shadow .35s ease}
.rule:hover{transform:translateY(-5px);box-shadow:0 18px 34px -22px rgba(11,61,78,.5)}
.rule h3{font-size:30px;font-weight:700;margin-bottom:9px}
.rule p{margin:0;color:var(--testo-soft);font-size:15px}
.in .rule{animation:sale .7s cubic-bezier(.16,.8,.3,1) both;animation-delay:calc(var(--i,0)*70ms)}

/* dotazioni */
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));
  gap:clamp(26px,3.4vw,44px);margin-top:clamp(30px,4vw,44px)}
.kit h3{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acqua);font-weight:500;
  padding-bottom:10px;border-bottom:1px solid var(--sabbia-scura);margin-bottom:14px}
.kit ul{list-style:none;margin:0;padding:0;font-size:15px}
.kit li{padding:4px 0 4px 16px;color:var(--testo-soft);position:relative}
.kit li::before{content:"";position:absolute;left:0;top:14px;width:5px;height:5px;
  border-radius:50%;background:var(--schiuma)}

/* calendario */
.calbar{display:flex;align-items:center;gap:10px;margin:clamp(30px,4vw,44px) 0 22px;flex-wrap:wrap}
button.nav{font:500 14px/1 "Instrument Sans",sans-serif;background:var(--carta);color:var(--testo);
  border:1px solid var(--sabbia-scura);padding:11px 15px;cursor:pointer;transition:.25s}
button.nav:hover:not(:disabled){background:var(--abisso);color:var(--carta);border-color:var(--abisso)}
button.nav:disabled{opacity:.35;cursor:default}
.legend{display:flex;gap:18px;margin-left:auto;font-size:13px;color:var(--testo-soft);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px;
  border:1px solid var(--sabbia-scura)}
.legend .free{background:var(--carta)}
.legend .busy{background:var(--abisso);border-color:var(--abisso)}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:clamp(22px,3vw,36px)}
.month h3{font-size:30px;font-weight:700;margin-bottom:12px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--testo-soft);
  text-align:center;padding-bottom:7px;text-transform:uppercase}
.day-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono",monospace;font-size:13px;background:var(--carta);
  border:1px solid var(--sabbia-scura);opacity:0;animation:sfuma .4s ease forwards}
.day-cell.empty{background:transparent;border-color:transparent}
.day-cell.busy{background:var(--abisso);color:var(--schiuma);border-color:var(--abisso)}
.day-cell.past{opacity:0;animation:pallido .4s ease forwards}
@keyframes pallido{to{opacity:.28}}
.day-cell.today{outline:2px solid var(--sole);outline-offset:-2px;font-weight:500}
.note{background:var(--carta);border:1px solid var(--sabbia-scura);border-left:3px solid var(--sole);
  padding:18px 20px;margin-top:24px;font-size:15px;color:var(--testo-soft)}
.note strong{color:var(--testo)}

.cta{display:inline-block;margin-top:30px;background:var(--abisso);color:var(--carta);
  text-decoration:none;padding:16px 30px;font-weight:600;font-size:15px;
  transition:background .3s ease,transform .3s cubic-bezier(.16,.8,.3,1)}
.cta:hover{background:var(--acqua);color:var(--abisso);transform:translateY(-3px)}

/* piede: di nuovo acqua */
.fondo{position:relative;background:var(--abisso);color:var(--schiuma);margin-top:clamp(40px,6vw,70px)}
.fondo .onda-alta{position:absolute;top:-1px;left:0;right:0;line-height:0;transform:rotate(180deg)}
.fondo .onda-alta svg{display:block;width:200%;height:clamp(46px,6vw,80px);
  animation:scorri 24s linear infinite}
.fondo .dentro{padding:clamp(74px,10vw,120px) 0 clamp(40px,5vw,64px);position:relative;z-index:2}
.fondo p{margin:0;font-size:15px;color:rgba(159,216,213,.85);max-width:46ch}
.fondo .mono{display:block;font-size:11px;margin-top:14px;color:rgba(159,216,213,.55)}

a:focus-visible,button:focus-visible{outline:3px solid var(--sole);outline-offset:3px}

@media (max-width:560px){
  .lane,.hours{grid-template-columns:1fr;gap:6px}
  .lane-name{text-align:left}
  .hours div:first-child{display:none}
  .fact dd{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .hero h1 span,.hero .lede,.day-cell{opacity:1}
  .seg{transform:none}
  .seg>span{opacity:1}
  .day-cell.past{opacity:.28}
}
</style>
</head>
<body>

<div class="sea">
  <div class="wrap">
    <div class="topbar">
      <span class="brand" id="brand">LA CASA DI LORY</span>
      <nav id="lang" aria-label="Lingua"></nav>
    </div>

  <div class="waves" aria-hidden="true">

    <svg viewBox="0 0 2400 200" preserveAspectRatio="none"><path fill="#9FD8D5" d="M0,120 C200,70 400,160 600,120 C800,80 1000,160 1200,120 C1400,70 1600,160 1800,120 C2000,80 2200,160 2400,120 L2400,200 L0,200 Z"/></svg>
    <svg viewBox="0 0 2400 200" preserveAspectRatio="none"><path fill="#F2EBDD" d="M0,130 C180,90 380,175 600,135 C820,95 1020,175 1200,130 C1380,90 1580,175 1800,135 C2020,95 2220,175 2400,130 L2400,200 L0,200 Z"/></svg>
  </div>
</div>

<div class="wrap">
  <dl class="facts" id="facts"></dl>

  <section class="reveal">
    <p class="eyebrow" id="eb-day"></p>
    <h2 id="h-day"></h2>
    <p class="sub" id="sub-day"></p>
    <div class="day">
      <div class="lane"><div class="lane-name" id="ln-quiet"></div><div class="track" id="lane-quiet"></div></div>
      <div class="lane"><div class="lane-name" id="ln-in"></div><div class="track" id="lane-in"></div></div>

  <section class="reveal">

  <section class="reveal">
    <p class="eyebrow" id="eb-kit"></p>
    <h2 id="h-kit"></h2>
    <p class="sub" id="sub-kit"></p>
    <div class="kit" id="kit"></div>
  </section>

  <section class="reveal">
    <p class="eyebrow" id="eb-cal"></p>
    <h2 id="h-cal"></h2>
    <p class="sub" id="sub-cal"></p>
    <div class="calbar">
      <button class="nav" id="prev" type="button"></button>
      <button class="nav" id="next" type="button"></button>
      <div class="legend">
        <span><i class="free"></i><span id="lg-free"></span></span>
        <span><i class="busy"></i><span id="lg-busy"></span></span>
      </div>
    </div>
    <div class="months" id="months"></div>
    <div class="note" id="cal-note" hidden></div>
    <a class="cta" id="cta-book" href="#"></a>
  </section>
</div>

<div class="fondo">
  <div class="onda-alta" aria-hidden="true">
    <svg viewBox="0 0 2400 200" preserveAspectRatio="none"><path fill="#F2EBDD" d="M0,120 C200,70 400,160 600,120 C800,80 1000,160 1200,120 C1400,70 1600,160 1800,120 C2000,80 2200,160 2400,120 L2400,200 L0,200 Z"/></svg>
  </div>
  <div class="wrap dentro">
    <p id="ft-1"></p>
    <span class="mono"><span id="ft-2"></span> <span id="upd">—</span></span>
  </div>
</div>

/* ======================================================== */

const $ = id => document.getElementById(id);
let lang = "it", t = T.it, notaCorrente = null;

function scegliLingua(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q] && CONFIG.lingue.includes(q)) return q;
  for (const l of (navigator.languages || [navigator.language || ""])){
    const c = l.slice(0,2).toLowerCase();
    if (T[c] && CONFIG.lingue.includes(c)) return c;
  }
  return CONFIG.lingue[0];
}

function selettore(){
  const nav = $("lang");
  nav.innerHTML = "";
  CONFIG.lingue.forEach(l => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = l;
    b.title = T[l].nome;
    b.setAttribute("aria-current", l === lang ? "true" : "false");
    b.onclick = () => cambia(l);
    nav.appendChild(b);
  });
}

function cambia(l){
  lang = l; t = T[l];
  document.documentElement.lang = l;
  const u = new URL(location);
  u.searchParams.set("lang", l);
  history.replaceState(null, "", u);
  render(); selettore();
}

/* ---------- rendering ---------- */
const h2n = s => { const [h,m] = s.split(":").map(Number); return h + m/60; };
const pct = n => (n/24*100) + "%";
function seg(lane, from, to, cls, label, ritardo){
  const el = document.createElement("span");
  el.className = "seg " + cls;
  el.style.left = pct(from);
  el.style.width = pct(to - from);
  el.style.animationDelay = ritardo + "ms";
  const s = document.createElement("span");
  s.textContent = label;
  s.style.animationDelay = (ritardo + 450) + "ms";
  el.appendChild(s);
  $(lane).appendChild(el);
}

function render(){
  document.title = CONFIG.nome + " — Portoscuso";
  $("brand").textContent = CONFIG.nome.toUpperCase();

  $("h-title").innerHTML = "";
  t.titolo.forEach(riga => {
    const s = document.createElement("span");
    s.textContent = riga;
    $("h-title").appendChild(s);
  });
  $("lede").textContent = t.lede;

  $("facts").innerHTML = "";
  t.facts.forEach(([dt, dd, small]) => {
    const box = document.createElement("div"); box.className = "fact";
    const a = document.createElement("dt"); a.textContent = dt;
    const b = document.createElement("dd"); b.append(dd);
    const s = document.createElement("small"); s.textContent = small;
    b.appendChild(s); box.append(a, b); $("facts").appendChild(box);
  });

  $("eb-day").textContent = t.ebDay; $("h-day").textContent = t.hDay; $("sub-day").textContent = t.subDay;
  [$("ln-quiet"), $("ln-in"), $("ln-out")].forEach((el,i) => el.textContent = t.lanes[i]);
  ["lane-quiet","lane-in","lane-out"].forEach(id => $(id).innerHTML = "");
  seg("lane-quiet", 0, h2n(CONFIG.silenzioA), "seg-quiet", t.fino + " " + CONFIG.silenzioA, 0);
  seg("lane-quiet", h2n(CONFIG.silenzioDa), 24, "seg-quiet", t.dalle + " " + CONFIG.silenzioDa, 90);
  seg("lane-in", h2n(CONFIG.checkinDa), h2n(CONFIG.checkinA), "seg-in", CONFIG.checkinDa + " – " + CONFIG.checkinA, 180);
  seg("lane-out", 0, h2n(CONFIG.checkout), "seg-out", t.entro + " " + CONFIG.checkout, 270);

  $("eb-rules").textContent = t.ebRules; $("h-rules").textContent = t.hRules; $("sub-rules").textContent = t.subRules;
  $("rules").innerHTML = "";
  t.rules.forEach(([h, p], i) => {
    const d = document.createElement("div"); d.className = "rule"; d.style.setProperty("--i", i);
    const t3 = document.createElement("h3"); t3.textContent = h;
    const pp = document.createElement("p"); pp.textContent = p;
    d.append(t3, pp); $("rules").appendChild(d);
  });

  $("eb-kit").textContent = t.ebKit; $("h-kit").textContent = t.hKit; $("sub-kit").textContent = t.subKit;
  $("kit").innerHTML = "";
  t.kit.forEach(([h, items]) => {
    const d = document.createElement("div");
    const t3 = document.createElement("h3"); t3.textContent = h;
    const ul = document.createElement("ul");
    items.forEach(i => { const li = document.createElement("li"); li.textContent = i; ul.appendChild(li); });
    d.append(t3, ul); $("kit").appendChild(d);
  });

  $("eb-cal").textContent = t.ebCal; $("h-cal").textContent = t.hCal; $("sub-cal").textContent = t.subCal;
  $("prev").textContent = t.prev; $("next").textContent = t.next;
  $("lg-free").textContent = t.free; $("lg-busy").textContent = t.busy;
  $("cta-book").textContent = t.cta; $("cta-book").href = CONFIG.annuncio;
  $("ft-1").textContent = t.ft1; $("ft-2").textContent = t.ft2;
  if (notaCorrente) $("cal-note").innerHTML = t[notaCorrente];
  disegna();
}

/* ---------- calendario ---------- */
const ymd = s => new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const key = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

function giorniOccupati(ics){
  const set = new Set();
  const testo = ics.replace(/\r\n[ \t]/g, "");
  for (const ev of testo.split("BEGIN:VEVENT").slice(1)){
    const s = /DTSTART[^:]*:(\d{8})/.exec(ev);
    const e = /DTEND[^:]*:(\d{8})/.exec(ev);
    if (!s) continue;
    const d0 = ymd(s[1]);
    const d1 = e ? ymd(e[1]) : addDays(d0,1);
    for (let d = new Date(d0); d < d1; d = addDays(d,1)) set.add(key(d));
  }
  return set;
}

let occupati = new Set(), offset = 0;
const oggi = new Date(); oggi.setHours(0,0,0,0);

function iniziali(){
  const f = new Intl.DateTimeFormat(lang, { weekday:"narrow" });
  const lunedi = new Date(2024,0,1);
  return [...Array(7)].map((_,i) => f.format(addDays(lunedi,i)));
}

function mese(base, ritardoBase){
  const box = document.createElement("div"); box.className = "month";
  const h = document.createElement("h3");
  h.textContent = base.toLocaleDateString(lang, { month:"long", year:"numeric" });
  box.appendChild(h);

  const g = document.createElement("div"); g.className = "grid";
  iniziali().forEach(d => { const c = document.createElement("div"); c.className = "dow"; c.textContent = d; g.appendChild(c); });

  const primo = (base.getDay() + 6) % 7;
  const ultimo = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  for (let i = 0; i < primo; i++){ const c = document.createElement("div"); c.className = "day-cell empty"; g.appendChild(c); }
  for (let n = 1; n <= ultimo; n++){
    const d = new Date(base.getFullYear(), base.getMonth(), n);
    const c = document.createElement("div");
    c.className = "day-cell";
    c.textContent = n;
    c.style.animationDelay = (ritardoBase + n * 9) + "ms";
    if (d < oggi) c.classList.add("past");
    else if (occupati.has(key(d))){ c.classList.add("busy"); c.title = t.busy; }
    if (d.getTime() === oggi.getTime()) c.classList.add("today");
    g.appendChild(c);
  }
  box.appendChild(g);
  return box;
}

function disegna(){
  const cont = $("months"); cont.innerHTML = "";
  for (let i = 0; i < CONFIG.mesiVisibili; i++){
    cont.appendChild(mese(new Date(oggi.getFullYear(), oggi.getMonth() + offset + i, 1), i * 160));
  }
  $("prev").disabled = offset <= 0;
}

$("prev").onclick = () => { if (offset > 0){ offset--; disegna(); } };
$("next").onclick = () => { offset++; disegna(); };

/* ---------- comparsa allo scroll ---------- */
const osservatore = new IntersectionObserver((voci) => {
  voci.forEach(v => { if (v.isIntersecting){ v.target.classList.add("in"); osservatore.unobserve(v.target); } });
}, { threshold: .16 });
document.querySelectorAll(".reveal").forEach(el => osservatore.observe(el));

/* ---------- avvio ---------- */
lang = scegliLingua(); t = T[lang];
document.documentElement.lang = lang;
selettore();
render();

(async function carica(){
  if (!CONFIG.icsUrl){
    notaCorrente = "noIcs"; $("cal-note").hidden = false; $("cal-note").innerHTML = t.noIcs;
    return;
  }
  try{
    const r = await fetch(CONFIG.icsUrl, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    occupati = giorniOccupati(await r.text());
    disegna();
    const lm = r.headers.get("last-modified");
    $("upd").textContent = (lm ? new Date(lm) : new Date()).toLocaleDateString(lang);
  }catch(err){
    notaCorrente = "errIcs"; $("cal-note").hidden = false; $("cal-note").innerHTML = t.errIcs;
    $("upd").textContent = "—";
    console.warn("Calendario non caricato:", err);
  }
})();
</script>
